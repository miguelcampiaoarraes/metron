<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="260" height="60" fill="none">
  <defs>
    <linearGradient id="mEmeraldWhiteGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="mDarkTileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Monogram M Emblem -->
  <g transform="translate(6, 6)">
    <rect width="48" height="48" rx="14" fill="url(#mDarkTileGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" />
    
    <!-- Coluna Esquerda -->
    <path d="M14 36V16h4.5v20H14z" fill="#ffffff" />
    <!-- Diagonais Emerald -->
    <path d="M18.5 16l8.5 14.5h-5.2L16.2 21.2V16h2.3z" fill="url(#mEmeraldWhiteGrad)" />
    <path d="M29.5 30.5L38 16h-4.5l-5.6 9.8-3.4-5.8h4.5z" fill="url(#mEmeraldWhiteGrad)" />
    <!-- Coluna Direita -->
    <path d="M33.5 36V16H38v20h-4.5z" fill="#ffffff" />
    
    <!-- Âncora de Precisão -->
    <circle cx="27" cy="15" r="2.2" fill="#34d399" />
  </g>

  <!-- Wordmark METRON White -->
  <text x="70" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="900" letter-spacing="3" fill="#ffffff">METRON</text>
  <text x="71" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" letter-spacing="1.2" fill="#34d399">GESTÃO &amp; PRECISÃO FINANCEIRA</text>
</svg>