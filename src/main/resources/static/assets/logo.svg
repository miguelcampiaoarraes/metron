<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="260" height="60" fill="none">
  <defs>
    <linearGradient id="mEmeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="40%" stop-color="#059669" />
      <stop offset="80%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="mDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="mGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Monogram M Emblem: Arquitetura Geométrica de Precisão -->
  <g transform="translate(6, 6)">
    <!-- Base Obsidian Tile -->
    <rect width="48" height="48" rx="14" fill="url(#mDarkGrad)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="1" y="1" width="46" height="46" rx="13" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <!-- Precision Chevron 'M' Lines -->
    <!-- Coluna Esquerda -->
    <path d="M14 36V16h4.5v20H14z" fill="#ffffff" />
    <!-- Diagonal Esquerda Descendente -->
    <path d="M18.5 16l8.5 14.5h-5.2L16.2 21.2V16h2.3z" fill="url(#mEmeraldGrad)" filter="url(#mGlow)" />
    <!-- Diagonal Direita Descendente -->
    <path d="M29.5 30.5L38 16h-4.5l-5.6 9.8-3.4-5.8h4.5z" fill="url(#mEmeraldGrad)" filter="url(#mGlow)" />
    <!-- Coluna Direita -->
    <path d="M33.5 36V16H38v20h-4.5z" fill="#ffffff" />
    
    <!-- Ponto de Métrica / Âncora de Precisão -->
    <circle cx="27" cy="15" r="2.2" fill="#34d399" />
  </g>

  <!-- Wordmark METRON -->
  <text x="70" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="900" letter-spacing="3" fill="#0f172a">METRON</text>
  <text x="71" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" letter-spacing="1.2" fill="#059669">GESTÃO &amp; PRECISÃO FINANCEIRA</text>
</svg>